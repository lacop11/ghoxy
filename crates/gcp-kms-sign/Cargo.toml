[package]
name = "gcp-kms-sign"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
gcp_auth = { version = "0.12.6", default-features = false, features = ["aws-lc-rs"] }
http = "1.4.0"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros"] }
