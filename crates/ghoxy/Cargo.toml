[package]
name = "ghoxy"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
gcp-kms-sign = { path = "../gcp-kms-sign" }
client-auth = { path = "../client-auth" }
github-auth = { path = "../github-auth" }
rules = { path = "../rules" }

tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.5.54", features = ["derive"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
axum = "0.8.8"
tracing = "0.1.44"
tower-http = {version = "0.6.8", features = ["trace"] }
thiserror = "2.0.17"
reqwest = { version = "0.13.1", features = ["stream"] }

# TODO: Avoid direct dependency, remove ring from all transitive deps instead?
rustls = { version = "0.23.26", default-features=false, features = ["aws_lc_rs"] }

[[bin]]
name = "dump-client-token"
path = "src/bin/dump_client_token.rs"

[[bin]]
name = "create-github-token"
path = "src/bin/create_github_token.rs"

[[bin]]
name = "check-rule"
path = "src/bin/check_rule.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"
