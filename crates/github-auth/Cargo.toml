[package]
name = "github-auth"
license = "MIT OR Apache-2.0"
version = "0.0.0"
edition = "2024"

[dependencies]
gcp-kms-sign = { path = "../gcp-kms-sign" }

base64 = "0.22.1"
chrono = "0.4.43"
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["aws_lc_rs"] }
jwks = { version = "0.5.2", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", default-features = false }
