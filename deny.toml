# TODO: Go over the full set of config options and tune it more.

[bans]
# Multiple versions of the same crate are not ideal but hard to avoid,
# some of our dependencies individually already break this rule. Just allow it.
multiple-versions = "allow"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # TODO: Maybe we can avoid openssl dependency entirely and just use rustls?
    "OpenSSL",
]

[advisories]
ignore = [
    # Unmaintained crate via transitive dependency.
    # Already replaced in https://github.com/cel-rust/cel-rust/commit/9a75f9f3ca4d2547277924b5ae4e12610019b5ea
    # Just need to wait for new release of `cel` crate to pull in the fix.
    # FIXME: Remove.
    "RUSTSEC-2024-0436",
]
